apiVersion: apps/v1
kind: Deployment
metadata: {name: hobbit-api, namespace: security}
spec:
  replicas: 2
  selector: {matchLabels: {app: hobbit-api}}
  template:
    metadata: {labels: {app: hobbit-api}}
    spec:
      serviceAccountName: hobbit-api
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: api
        image: hobbit-ng/api:3.0.0
        ports: [{containerPort: 8000}]
        env:
        - name: REDIS_URL
          valueFrom: {secretKeyRef: {name: hobbit-secrets, key: redis-url}}
        - name: JWT_SECRET
          valueFrom: {secretKeyRef: {name: hobbit-secrets, key: jwt-secret}}
        resources:
          requests: {memory: "256Mi", cpu: "250m"}
          limits: {memory: "1Gi", cpu: "1000m"}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: hobbit-api, namespace: security}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: hobbit-api-read, namespace: security}
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: hobbit-api-read, namespace: security}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: hobbit-api-read}
subjects: [{kind: ServiceAccount, name: hobbit-api, namespace: security}]
