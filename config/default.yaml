scanning:
  top_ports: [21, 22, 23, 25, 53, 80, 110, 143, 443, 445, 3306, 3389, 5432, 5900, 8080, 8443]
  fast_ports: [22, 53, 80, 443, 445, 3389, 8080, 8443]
  deep_ports: "1-1024,1433,1521,3306,3389,5432,5900,6379,8080,8443,9200,27017"
  timeout: 2
  max_concurrent_tasks: 256
  max_hosts_parallel: 64
  max_hosts_per_target: 4096
  max_total_hosts: 8192
  retry_count: 1

target_policy:
  # Turn this on in production to require all active scan targets to be explicitly in scope.
  enforce_allowlist: false
  allowed_networks: []
  denied_networks: []
  allowed_hostnames: []
  denied_hostnames: []

ai:
  exploration_rate: 0.1
  learning_rate: 0.1
  discount_factor: 0.9
  llm:
    api_key_env: "OPENAI_API_KEY"
    model: "gpt-5-mini"

threat_intel:
  sources: ["cisa_kev", "epss", "virustotal", "abuseipdb", "alienvault"]
  virustotal_api_key_env: "VIRUSTOTAL_API_KEY"
  abuseipdb_api_key_env: "ABUSEIPDB_API_KEY"

graph:
  max_depth: 5
  risk_threshold: 0.7

supply_chain:
  sbom_formats: ["cyclonedx", "spdx"]
  osv_db: "https://api.osv.dev/v1/query"

deception:
  mode: "plan-only"

remediation:
  approval_required: true
  execution_enabled: false

compliance:
  frameworks: ["NIST-800-53", "SOC-2", "PCI-DSS", "HIPAA", "GDPR"]

logging:
  level: "INFO"
